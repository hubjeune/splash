    .bg{fill:#0d1117} .t,.v{fill:#e6edf3} .l{fill:#8d96a0} .g{stroke:#30363d}
    .s0{fill:#6e7681} .s1{fill:#4493f8} .s2{fill:#3fb950} .s3{fill:#d29922}}
</style>
<rect class="bg" width="760" height="380" rx="8"/>
<text class="t" x="60" y="28">Long-context attention: what each probe costs (131K context, 4 requests)</text>
