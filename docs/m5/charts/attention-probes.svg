<text class="v" x="204.2" y="126.3" text-anchor="middle">2.83</text>
<text class="l" x="205.7" y="328" text-anchor="middle">no softmax</text>
<rect class="s0" x="279.9" y="144.9" width="43.0" height="165.1" rx="2"/>
<text class="v" x="301.4" y="140.9" text-anchor="middle">2.60</text>
<text class="l" x="302.9" y="328" text-anchor="middle">no softmax+barriers</text>
<rect class="s0" x="377.0" y="179.2" width="43.0" height="130.8" rx="2"/>
<text class="v" x="398.5" y="175.2" text-anchor="middle">2.06</text>
<text class="l" x="400.0" y="328" text-anchor="middle">no PV</text>
<rect class="s0" x="474.1" y="214.8" width="43.0" height="95.2" rx="2"/>
