<text class="v" x="592.8" y="109.2" text-anchor="middle">3.10</text>
<text class="l" x="594.3" y="328" text-anchor="middle">A4 QK on 4 sg</text>
<rect class="s0" x="668.4" y="93.5" width="43.0" height="216.5" rx="2"/>
<text class="v" x="689.9" y="89.5" text-anchor="middle">3.41</text>
<text class="l" x="691.4" y="328" text-anchor="middle">A6 int8 QK</text>
<rect class="s0" x="60" y="350" width="12" height="12" rx="2"/>
